resources:
  jobs:
    Spotify_Analytics_Pipeline:
      name: Spotify Analytics Pipeline

      tasks:
        - task_key: silver_transform_recently_played
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/02_silver_transform_recently_played.py
            source: WORKSPACE
          environment_key: Default

        - task_key: silver_build_entities
          depends_on:
            - task_key: silver_transform_recently_played
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/03_silver_build_entities.py
            source: WORKSPACE
          environment_key: Default

        - task_key: silver_data_quality
          depends_on:
            - task_key: silver_build_entities
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/04_silver_data_quality.py
            source: WORKSPACE
          environment_key: Default

        - task_key: dbt_gold
          depends_on:
            - task_key: silver_data_quality
          dbt_task:
            project_directory: ${workspace.file_path}/dbt
            commands:
              - dbt build --select gold
            source: WORKSPACE
            schema: gold
            warehouse_id: ${var.warehouse_id}
            catalog: spotify_analytics
          environment_key: dbt-default

      queue:
        enabled: true

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"

        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "5"

      performance_target: PERFORMANCE_OPTIMIZED